# Claude Board on the VPS: Postgres 16 and the board, always on. docs/ops/deploy.md walks through it.
#   cd deploy && cp env.example .env && chmod 600 .env   (fill it in)
#   docker compose up -d --build
# Secrets live in deploy/.env only (git-ignored): never in this file, the image or a log.
name: claude-board

services:
  db:
    image: postgres:16
    restart: unless-stopped
    # Watchtower (running on vps2) restarts whatever has a newer image: never the database or the board, whose
    # upgrades are deliberate (maintain.md)
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    environment:
      POSTGRES_USER: cb
      POSTGRES_PASSWORD: ${CB_PG_PASSWORD:?set CB_PG_PASSWORD in deploy/.env}
      POSTGRES_DB: claude_board
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The workers' cb (sessions on the PC and the Mac) talk to Postgres directly, over Tailscale: bind this to the
    # VPS's Tailscale address (CB_PG_BIND). Never 0.0.0.0: the database password would be all that guards the board.
    ports:
      - "${CB_PG_BIND:-127.0.0.1}:5434:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cb -d claude_board"]
      interval: 10s
      timeout: 5s
      retries: 12

  board:
    build:
      context: ..
      dockerfile: Dockerfile
    image: claude-board:latest
    # shell commands (dc exec board cb ...) are recorded as session@<this>, not session@<container id>
    hostname: ${CB_MACHINE:-vps}
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    depends_on:
      db:
        condition: service_healthy
    environment:
      CB_DATABASE_URL: postgres://cb:${CB_PG_PASSWORD}@db:5432/claude_board
      CB_PUBLIC_URL: ${CB_PUBLIC_URL:-}
      CB_MACHINE: ${CB_MACHINE:-vps}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      GH_TOKEN: ${GH_TOKEN:-}
      CB_BEHIND_CLOUDFLARE: ${CB_BEHIND_CLOUDFLARE:-0}
      CB_TRUST_LOCAL: "0"
    # gh's login (`dc exec board gh auth login`) lives here, so it survives rebuilds
    volumes:
      - ghconfig:/home/node/.config/gh
    # Nginx Proxy Manager reaches the board on its own network as http://claude-board:4747 (deploy.md, step 4).
    # The loopback port is for curl and healthz on the VPS itself; nothing else can reach it.
    networks:
      default: {}
      proxy:
        aliases: [claude-board]
    ports:
      - "127.0.0.1:${CB_PORT:-4747}:4747"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4747/healthz').then(r => process.exit(r.ok ? 0 : 1), () => process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

volumes:
  pgdata:
  ghconfig:

networks:
  # The proxy's network, made by Nginx Proxy Manager's own compose (`docker network ls`). Another proxy: its network,
  # or `docker network create cb-proxy` and CB_PROXY_NETWORK=cb-proxy.
  proxy:
    external: true
    name: ${CB_PROXY_NETWORK:-nginx-proxy-manager_default}
